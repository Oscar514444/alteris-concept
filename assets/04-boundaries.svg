<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="365" viewBox="0 0 1120 365" role="img" aria-labelledby="title desc"><title id="title">Границы концепции</title><desc id="desc">Портфолио и схемы без готовой реализации или гарантий безопасности.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10192b"/><stop offset="1" stop-color="#090f1c"/></linearGradient><linearGradient id="line"><stop stop-color="#78e5cd"/><stop offset="1" stop-color="#849dff"/></linearGradient><radialGradient id="orb"><stop stop-color="#91eadb" stop-opacity=".55"/><stop offset=".55" stop-color="#7b9afe" stop-opacity=".17"/><stop offset="1" stop-color="#6987e8" stop-opacity="0"/></radialGradient></defs><rect width="1120" height="365" rx="24" fill="url(#bg)"/><text x="44" y="65" fill="#8bd5c9" font-size="17" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">03  /  ЧЕСТНЫЕ ГРАНИЦЫ</text><text x="44" y="106" fill="#f4f7ff" font-size="29" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Задумано ≠ реализовано</text><rect x="44" y="143" width="503" height="174" rx="18" fill="#172638" stroke="#37536a" /><text x="67" y="183" fill="#eaf5ff" font-size="20" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Что представляет репозиторий</text><text x="67" y="218" fill="#b8c9db" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Публичное описание идеи и визуальные схемы.</text><text x="67" y="247" fill="#b8c9db" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Помогает обсудить направление и границы.</text><text x="67" y="278" fill="#b8c9db" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Не содержит личную память или исходные данные.</text><rect x="572" y="143" width="504" height="174" rx="18" fill="#261f30" stroke="#59415a" /><text x="595" y="183" fill="#f6eaf1" font-size="20" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Чего он не доказывает</text><text x="595" y="218" fill="#d5bdcc" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Работу автономного цифрового двойника.</text><text x="595" y="247" fill="#d5bdcc" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Реальную интеграцию памяти или действий.</text><text x="595" y="278" fill="#d5bdcc" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Гарантированную приватность или безопасность.</text></svg>