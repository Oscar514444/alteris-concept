<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="355" viewBox="0 0 1120 355" role="img" aria-labelledby="title desc"><title id="title">Предполагаемый процесс ALTERIS</title><desc id="desc">Концептуальная последовательность от намерения человека через контекст к решению и действию.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10192b"/><stop offset="1" stop-color="#090f1c"/></linearGradient><linearGradient id="line"><stop stop-color="#78e5cd"/><stop offset="1" stop-color="#849dff"/></linearGradient><radialGradient id="orb"><stop stop-color="#91eadb" stop-opacity=".55"/><stop offset=".55" stop-color="#7b9afe" stop-opacity=".17"/><stop offset="1" stop-color="#6987e8" stop-opacity="0"/></radialGradient></defs><rect width="1120" height="355" rx="24" fill="url(#bg)"/><text x="44" y="65" fill="#8bd5c9" font-size="17" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">02  /  ПРЕДПОЛАГАЕМЫЙ ПУТЬ</text><text x="44" y="106" fill="#f4f7ff" font-size="29" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">От запроса человека к решению</text><rect x="44" y="149" width="234" height="110" rx="18" fill="#141c2e" stroke="#2d3853" /><text x="62" y="190" fill="#f3f6ff" font-size="21" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Человек</text><text x="62" y="224" fill="#adbbd2" font-size="15" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">намерение</text><path d="M283 204 h17 m-6 -6 l6 6 -6 6" fill="none" stroke="#83d9ca" stroke-width="2"/><rect x="308" y="149" width="234" height="110" rx="18" fill="#141c2e" stroke="#2d3853" /><text x="326" y="190" fill="#f3f6ff" font-size="21" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Контекст</text><text x="326" y="224" fill="#adbbd2" font-size="15" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">факты и связи</text><path d="M547 204 h17 m-6 -6 l6 6 -6 6" fill="none" stroke="#83d9ca" stroke-width="2"/><rect x="572" y="149" width="234" height="110" rx="18" fill="#141c2e" stroke="#2d3853" /><text x="590" y="190" fill="#f3f6ff" font-size="21" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Обсуждение</text><text x="590" y="224" fill="#adbbd2" font-size="15" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">подготовка решения</text><path d="M811 204 h17 m-6 -6 l6 6 -6 6" fill="none" stroke="#83d9ca" stroke-width="2"/><rect x="836" y="149" width="234" height="110" rx="18" fill="#141c2e" stroke="#2d3853" /><text x="854" y="190" fill="#f3f6ff" font-size="21" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Действие</text><text x="854" y="224" fill="#adbbd2" font-size="15" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">только в границах</text><text x="44" y="316" fill="#9aaac2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Направление исследования: такой рабочий процесс здесь не реализован.</text></svg>