<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">Компоненты контекста</title><desc id="desc">Концептуальные элементы: факты, связи, предпочтения и границы.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10192b"/><stop offset="1" stop-color="#090f1c"/></linearGradient><linearGradient id="line"><stop stop-color="#78e5cd"/><stop offset="1" stop-color="#849dff"/></linearGradient><radialGradient id="orb"><stop stop-color="#91eadb" stop-opacity=".55"/><stop offset=".55" stop-color="#7b9afe" stop-opacity=".17"/><stop offset="1" stop-color="#6987e8" stop-opacity="0"/></radialGradient></defs><rect width="1120" height="380" rx="24" fill="url(#bg)"/><text x="44" y="65" fill="#8bd5c9" font-size="17" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">01  /  ИЗ ЧЕГО СКЛАДЫВАЕТСЯ КОНТЕКСТ</text><text x="44" y="106" fill="#f4f7ff" font-size="29" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Не архив сообщений, а смысловые связи</text><rect x="44" y="143" width="248" height="148" rx="18" fill="#141c2e" stroke="#2d3853" /><text x="64" y="183" fill="#80cbbb" font-size="14" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">01</text><text x="64" y="217" fill="#f3f6ff" font-size="21" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Факты</text><text x="64" y="247" fill="#adbbd2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Что известно</text><text x="64" y="271" fill="#adbbd2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">из доступных источников</text><rect x="309" y="143" width="248" height="148" rx="18" fill="#141c2e" stroke="#2d3853" /><text x="329" y="183" fill="#80cbbb" font-size="14" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">02</text><text x="329" y="217" fill="#f3f6ff" font-size="21" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Связи</text><text x="329" y="247" fill="#adbbd2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Как сведения</text><text x="329" y="271" fill="#adbbd2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">относятся друг к другу</text><rect x="574" y="143" width="248" height="148" rx="18" fill="#141c2e" stroke="#2d3853" /><text x="594" y="183" fill="#80cbbb" font-size="14" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">03</text><text x="594" y="217" fill="#f3f6ff" font-size="21" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Предпочтения</text><text x="594" y="247" fill="#adbbd2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Что важно человеку</text><text x="594" y="271" fill="#adbbd2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">в его решениях</text><rect x="839" y="143" width="248" height="148" rx="18" fill="#141c2e" stroke="#2d3853" /><text x="859" y="183" fill="#80cbbb" font-size="14" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">04</text><text x="859" y="217" fill="#f3f6ff" font-size="21" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">Границы</text><text x="859" y="247" fill="#adbbd2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Что разрешено</text><text x="859" y="271" fill="#adbbd2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">и что требует согласия</text><text x="44" y="337" fill="#9aaac2" font-size="16" font-weight="400" font-family="Inter, Segoe UI, Arial, sans-serif">Схема отражает замысел, а не подтверждённую реализацию памяти или политик.</text></svg>